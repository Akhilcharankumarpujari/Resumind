version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: resumind-db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: akhil123
      POSTGRES_DB: resumind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: resumind-backend
    restart: always
    environment:
      DATABASE_URL: postgres://root:akhil123@db:5432/resumind?sslmode=disable
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-akhil123jwtsecretkeyresumind32chars}
      PORT: 8080
      UPLOADS_DIR: ./uploads
    depends_on:
      - db
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: resumind-frontend
    restart: always
    environment:
      PORT: 3000
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    container_name: resumind-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
  uploads-data:
