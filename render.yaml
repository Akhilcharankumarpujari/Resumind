services:
  - type: web
    name: resumind-backend
    env: go
    rootDir: backend
    buildCommand: go build -o server .
    startCommand: ./server
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
